name: E-Commerce SQL Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Verify the checked-in SQLite schema and analytical invariants.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -q
